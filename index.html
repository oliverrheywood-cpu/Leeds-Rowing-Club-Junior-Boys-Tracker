<meta name="viewport"

<title>Athlete RAG Dashboard</title>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    color: #17202a;
}

/* ============================================
   LOGIN
============================================ */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #0b2239, #174b70);
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.2);
}

.login-box h1 {
    margin-bottom: 8px;
}

.login-box p {
    color: #687281;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    padding: 13px 15px;
    margin-bottom: 12px;
    border: 1px solid #d9dee5;
    border-radius: 9px;
    font-size: 15px;
}

.login-button {
    width: 100%;
    padding: 13px;
    background: #102a43;
    color: white;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.login-error {
    color: #dc2626;
    margin-top: 12px;
    font-size: 14px;
}

/* ============================================
   APP
============================================ */

.app {
    min-height: 100vh;
}

/* ============================================
   HEADER
============================================ */

header {
    background: linear-gradient(135deg, #0b2239, #174b70);
    color: white;
    padding: 30px 40px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 6px;
}

header p {
    color: #d9e6f2;
    font-size: 15px;
}

/* ============================================
   NAVIGATION
============================================ */

.navbar {
    background: #102a43;
    color: white;
    padding: 13px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-left {
    display: flex;
    gap: 8px;
    align-items: center;
}

.nav-right {
    display: flex;
    gap: 8px;
    align-items: center;
}

.nav-button {
    background: #294b68;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
}

.nav-button:hover {
    opacity: 0.85;
}

.logout {
    background: #b91c1c;
}

/* ============================================
   MAIN
============================================ */

.container {
    max-width: 1450px;
    margin: auto;
    padding: 25px;
}

/* ============================================
   TOOLBAR
============================================ */

.toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

input,
select,
textarea,
button {
    font-family: inherit;
}

#search {
    flex: 1;
    min-width: 250px;
    padding: 12px 15px;
    border: 1px solid #d9dee5;
    border-radius: 10px;
    background: white;
    font-size: 15px;
}

#filter {
    padding: 12px 15px;
    border: 1px solid #d9dee5;
    border-radius: 10px;
    background: white;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 17px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #102a43;
    color: white;
}

.secondary {
    background: white;
    border: 1px solid #d9dee5;
    color: #17202a;
}

/* ============================================
   SUMMARY
============================================ */

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 22px;
}

.stat {
    background: white;
    border: 1px solid #e1e5ea;
    border-radius: 15px;
    padding: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.stat-title {
    color: #6b7280;
    font-size: 13px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 5px;
}

/* ============================================
   FOLDER
============================================ */

.folder {
    background: white;
    border: 1px solid #e1e5ea;
    border-radius: 17px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.folder-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.folder-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.folder-icon {
    font-size: 32px;
}

.folder-title h2 {
    font-size: 23px;
}

.folder-title p {
    color: #8a94a3;
    font-size: 13px;
    margin-top: 3px;
}

.folder-count {
    background: #e8eef4;
    color: #102a43;
    padding: 7px 12px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 13px;
}

/* ============================================
   ATHLETE GRID
============================================ */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
}

/* ============================================
   ATHLETE CARD
============================================ */

.card {
    background: white;
    border: 1px solid #e1e5ea;
    border-radius: 17px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.card:hover {
    box-shadow: 0 7px 22px rgba(0,0,0,0.08);
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.athlete-name {
    font-size: 19px;
    font-weight: bold;
}

.athlete-subtitle {
    font-size: 12px;
    color: #8a94a3;
    margin-top: 4px;
}

.initial {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #e8eef4;
    color: #102a43;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* ============================================
   RAG
============================================ */

.rag-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.rag-box {
    border: 1px solid #e1e5ea;
    border-radius: 11px;
    padding: 10px;
    background: #fafafa;
}

.rag-box label {
    display: block;
    font-size: 12px;
    color: #687281;
    margin-bottom: 7px;
}

.rag-select {
    width: 100%;
    padding: 8px;
    border: 1px solid #d9dee5;
    border-radius: 8px;
    background: white;
}

/* ============================================
   RAG DOTS
============================================ */

.dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 5px;
}

.green {
    background: #16a34a;
}

.amber {
    background: #f59e0b;
}

.red {
    background: #dc2626;
}

.grey {
    background: #9ca3af;
}

/* ============================================
   NOTES
============================================ */

.notes {
    width: 100%;
    min-height: 85px;
    margin-top: 13px;
    padding: 10px;
    border: 1px solid #d9dee5;
    border-radius: 10px;
    resize: vertical;
    background: #fafafa;
}

/* ============================================
   FOOTER
============================================ */

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
}

.saved {
    font-size: 11px;
    color: #8a94a3;
}

/* ============================================
   ATHLETE PROFILE
============================================ */

.profile {
    background: white;
    border: 1px solid #e1e5ea;
    border-radius: 17px;
    padding: 25px;
}

.profile-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.profile-header h2 {
    font-size: 28px;
}

.profile-username {
    color: #8a94a3;
    margin-top: 5px;
}

.profile-rag {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.profile-rag-box {
    border: 1px solid #e1e5ea;
    border-radius: 12px;
    padding: 15px;
}

.profile-rag-box h3 {
    font-size: 14px;
    color: #687281;
    margin-bottom: 10px;
}

.profile-rag-value {
    font-size: 20px;
    font-weight: bold;
}

.profile-notes {
    margin-top: 20px;
    padding: 18px;
    background: #fafafa;
    border-radius: 12px;
    border: 1px solid #e1e5ea;
}

.profile-notes h3 {
    margin-bottom: 10px;
}

/* ============================================
   HISTORY
============================================ */

.history {
    margin-top: 20px;
}

.history-item {
    padding: 14px 0;
    border-bottom: 1px solid #e5e7eb;
}

.history-item:last-child {
    border-bottom: none;
}

.history-category {
    font-weight: bold;
}

.history-change {
    margin-top: 4px;
}

.history-date {
    color: #8a94a3;
    font-size: 12px;
    margin-top: 4px;

/* ============================================
   LOADING
============================================ */

.loading {
    text-align: center;
    padding: 50px;
    color: #687281;
}

/* ============================================
   HIDDEN
============================================ */

.hidden {
    display: none !important;
}

/* ============================================
   MOBILE
============================================ */

@media (max-width: 750px) {

    header {
        padding: 22px;
    }

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 15px;
    }

    .summary {
        grid-template-columns: 1fr 1fr;
    }

    .rag-grid,
    .profile-rag {
        grid-template-columns: 1fr;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .navbar {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
    }

    .nav-left,
    .nav-right {
        justify-content: center;
        flex-wrap: wrap;
    }

}

</style>

/* ============================================
   LOAD GOOGLE SHEET
============================================ */

async function loadGoogleSheet() {

    try {

        const response =
            await fetch(
                GOOGLE_SHEET_URL +
                "&cache=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Unable to access Google Sheet."
            );

        }


        const csv =
            await response.text();


        const rows =
            parseCSV(csv);


        if (
            rows.length < 2
        ) {

            throw new Error(
                "No athlete data found."
            );

        }


        const headers =
            rows[0]
            .map(header =>
                header.trim()
            );


        athletes =
            rows
            .slice(1)
            .filter(row =>
                row[0] &&
                row[0].trim() !== ""
            )
            .map(row => {

                const athlete = {};

                headers.forEach(
                    (header, index) => {

                        athlete[header] =
                            row[index] || "";

                    }
                );

                return athlete;

            });


        return athletes;


    } catch (error) {

        console.error(
            "Google Sheet error:",
            error
        );

        throw error;

    }

}


/* ============================================
   CSV PARSER
============================================ */

function parseCSV(csv) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < csv.length;
        i++
    ) {

        const char =
            csv[i];

        const next =
            csv[i + 1];


        if (
            char === '"' &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);

            rows.push(row);

            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);

        rows.push(row);

    }


    return rows;

}


/* ============================================

============================================ */

    return athletes.find(

/* ============================================

    }


    return "grey";

}


/* ============================================
   ESCAPE HTML
============================================ */

function escapeHTML(text) {

    return String(text ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ============================================
   ESCAPE JS
============================================ */

function escapeJS(text) {

    return String(text)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        );

}

        currentUser.role === "athlete"

            <button
                class="primary"
                onclick="showAthletes()"
            >
                Open Boys
            </button>


            <button
                class="secondary"
                onclick="exportCSV()"
            >
                Export CSV
            </button>

        </div>


        <div class="summary">

            <div class="stat">

                <div class="stat-title">
                    Athletes
                </div>

                <div
                    class="stat-number"
                    id="athleteCount"
                >
                    ${athletes.length}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    🟢 Green Ratings
                </div>

                <div
                    class="stat-number"
                    id="greenCount"
                >
                    ${green}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    🟠 Amber Ratings
                </div>

                <div
                    class="stat-number"
                    id="amberCount"
                >
                    ${amber}
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    🔴 Red Ratings
                </div>

                <div
                    class="stat-number"
                    id="redCount"
                >
                    ${red}
                </div>

            </div>

        </div>


        <div id="athleteArea"></div>

    `;


    renderAthletes();

}


/* ============================================
   ATHLETE FOLDER
============================================ */

function showAthletes() {

    if (
        !currentUser ||
        currentUser.role === "athlete"
    ) {

        return;

    }


    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = `

        <div class="toolbar">

            <button
                class="secondary"
                onclick="showDashboard()"
            >
                ← Dashboard
            </button>

            <input
                type="text"
                id="search"
                placeholder="Search athletes..."
                oninput="renderAthletes()"
            >

            <select
                id="filter"
                onchange="renderAthletes()"
            >

                <option value="all">
                    All athletes
                </option>

                <option value="red">
                    Any Red
                </option>

                <option value="amber">
                    Any Amber
                </option>

                <option value="green">
                    Any Green
                </option>

                <option value="unrated">
                    Unrated
                </option>

            </select>

        </div>


        <div id="athleteArea"></div>

    `;


    renderAthletes();

}


/* ============================================
   RENDER ATHLETES INSIDE BOYS FOLDER
============================================ */

function renderAthletes() {

    const area =
        document.getElementById(
            "athleteArea"
        );


    if (!area) {

        return;

    }


    const searchElement =
        document.getElementById(
            "search"
        );


    const filterElement =
        document.getElementById(
            "filter"
        );


    const search =
        searchElement
            ? searchElement.value
                .toLowerCase()
                .trim()
            : "";


    const filter =
        filterElement
            ? filterElement.value
            : "all";


    const filtered =
        athletes.filter(
            athlete => {

                const name =
                    athlete["Athlete"] || "";


                const ratings =
                    categories.map(
                        category =>
                            athlete[category] || ""
                    );


                if (
                    !name
                        .toLowerCase()
                        .includes(search)
                ) {

                    return false;

                }


                if (
                    filter === "red" &&
                    !ratings.includes("Red")
                ) {

                    return false;

                }


                if (
                    filter === "amber" &&
                    !ratings.includes("Amber")
                ) {

                    return false;

                }


                if (
                    filter === "green" &&
                    !ratings.includes("Green")
                ) {

                    return false;

                }


                if (
                    filter === "unrated"
                ) {

                    return !ratings.some(
                        rating =>
                            rating === "Green" ||
                            rating === "Amber" ||
                            rating === "Red"
                    );

                }


                return true;

            }
        );


    let cards = "";


    filtered.forEach(
        athlete => {

            cards +=
                createAthleteCard(
                    athlete
                );

        }
    );


    area.innerHTML = `

        <div class="folder">

            <div class="folder-header">

                <div class="folder-title">

                    <div class="folder-icon">
                        📁
                    </div>

                    <div>

                        <h2>
                            Boys
                        </h2>

                        <p>
                            Male athlete squad
                        </p>

                    </div>

                </div>


                <div class="folder-count">

                    ${filtered.length}
                    athlete${filtered.length === 1 ? "" : "s"}

                </div>

            </div>


            <div class="grid">

                ${
                    cards ||
                    `
                    <div
                        style="
                            grid-column: 1 / -1;
                            text-align: center;
                            padding: 40px;
                            color: #687281;
                        "
                    >
                        No athletes match your search.
                    </div>
                    `
                }

            </div>

        </div>

    `;

}


/* ============================================
   CREATE ATHLETE CARD
============================================ */

function createAthleteCard(
    athlete
) {

    const name =
        athlete["Athlete"] || "";


    const username =
        athlete["Username"] || "";


    const initials =
        name
            .split(" ")
            .map(
                word =>
                    word[0]
            )
            .join("")
            .substring(0, 2)
            .toUpperCase();


    let ragHTML = "";


    categories.forEach(
        category => {

            const current =
                athlete[category] || "";


            ragHTML += `

                <div class="rag-box">

                    <label>

                        <span
                            class="dot ${getColour(current)}"
                        ></span>

                        ${escapeHTML(
                            category
                        )}

                    </label>


                    <select
                        class="rag-select"
                        disabled
                    >

                        <option
                            value=""
                            ${
                                current === "" ||
                                current === "Not rated"
                                    ? "selected"
                                    : ""
                            }
                        >
                            Not rated
                        </option>


                        <option
                            value="Green"
                            ${
                                current === "Green"
                                    ? "selected"
                                    : ""
                            }
                        >
                            🟢 Green
                        </option>


                        <option
                            value="Amber"
                            ${
                                current === "Amber"
                                    ? "selected"
                                    : ""
                            }
                        >
                            🟠 Amber
                        </option>


                        <option
                            value="Red"
                            ${
                                current === "Red"
                                    ? "selected"
                                    : ""
                            }
                        >
                            🔴 Red
                        </option>

                    </select>

                </div>

            `;

        }
    );


    return `

        <div class="card">

            <div class="card-top">

                <div>

                    <div class="athlete-name">

                        ${escapeHTML(name)}

                    </div>

                    <div class="athlete-subtitle">

                        ${escapeHTML(username)}

                    </div>

                </div>


                <div class="initial">

                    ${escapeHTML(initials)}

                </div>

            </div>


            <div class="rag-grid">

                ${ragHTML}

            </div>


            <textarea
                class="notes"
                readonly
                placeholder="No coach notes"
            >${escapeHTML(
                athlete["Coach Notes"] || ""
            )}</textarea>


            <div class="card-footer">

                <span class="saved">

                    Last updated:
                    ${escapeHTML(
                        athlete["Last Updated"] ||
                        "Not recorded"
                    )}

                </span>


                <button
                    class="secondary"
                    onclick="
                        loadAthleteProfile(
                            '${escapeJS(name)}'
                        )
                    "
                >
                    Profile
                </button>

            </div>

        </div>

    `;

}


/* ============================================
   ATHLETE PROFILE
============================================ */

async function loadAthleteProfile(
    name
) {

    if (
        athletes.length === 0
    ) {

        try {

            await loadGoogleSheet();

        } catch (error) {

            showError(
                error.message
            );

            return;

        }

    }


    const athlete =
        getAthlete(name);


    if (!athlete) {

        showError(
            "Athlete not found."
        );

        return;

    }


    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = `

        <div class="toolbar">

            ${
                currentUser &&
                currentUser.role !== "athlete"
                    ? `
                        <button
                            class="secondary"
                            onclick="showAthletes()"
                        >
                            ← Boys
                        </button>
                    `
                    : ""
            }

        </div>


        <div class="profile">

            <div class="profile-header">

                <div>

                    <h2>
                        ${escapeHTML(
                            athlete["Athlete"]
                        )}
                    </h2>

                    <div class="profile-username">

                        Username:
                        ${escapeHTML(
                            athlete["Username"]
                        )}

                    </div>

                </div>


                <div class="initial">

                    ${escapeHTML(
                        (athlete["Athlete"] || "")
                            .split(" ")
                            .map(
                                word =>
                                    word[0]
                            )
                            .join("")
                            .substring(0, 2)
                            .toUpperCase()
                    )}

                </div>

            </div>


            <div class="profile-rag">

                ${categories.map(
                    category => {

                        const rating =
                            athlete[category] ||
                            "Not rated";


                        return `

                            <div
                                class="profile-rag-box"
                            >

                                <h3>

                                    <span
                                        class="dot ${getColour(rating)}"
                                    ></span>

                                    ${escapeHTML(
                                        category
                                    )}

                                </h3>


                                <div
                                    class="profile-rag-value"
                                >

                                    ${escapeHTML(
                                        rating
                                    )}

                                </div>

                            </div>

                        `;

                    }
                ).join("")}

            </div>


            <div class="profile-notes">

                <h3>
                    Coach Notes
                </h3>

                <p>

                    ${escapeHTML(
                        athlete["Coach Notes"] ||
                        "No coach notes."
                    )}

                </p>

            </div>


            <div class="profile-notes">

                <h3>
                    Last Updated
                </h3>

                <p>

                    ${escapeHTML(
                        athlete["Last Updated"] ||
                        "Not recorded"
                    )}

                </p>

            </div>


            <div class="history">

                <h3>
                    Rating History
                </h3>

                <div id="historyContainer">

                    Loading history...

                </div>

            </div>

        </div>

    `;


    loadHistory(
        athlete["Athlete"]
    );

}


/* ============================================
   LOAD HISTORY
============================================ */

/*
   IMPORTANT:

   Without Apps Script, Google Sheets cannot
   automatically expose the History tab through
   the same published CSV unless you publish
   that tab separately.

   This function attempts to load the History
   tab if you provide its CSV URL below.
*/

const HISTORY_SHEET_URL =
    "";


async function loadHistory(
    athleteName
) {

    const container =
        document.getElementById(
            "historyContainer"
        );


    if (
        !HISTORY_SHEET_URL
    ) {

        container.innerHTML = `

            <p
                style="
                    color: #8a94a3;
                    margin-top: 10px;
                "
            >
                No history feed connected.
            </p>

        `;

        return;

    }


    try {

        const response =
            await fetch(
                HISTORY_SHEET_URL +
                "&cache=" +
                Date.now()
            );


        const csv =
            await response.text();


        const rows =
            parseCSV(csv);


        if (
            rows.length < 2
        ) {

            container.innerHTML =
                "<p>No rating history yet.</p>";

            return;

        }


        const headers =
            rows[0].map(
                header =>
                    header.trim()
            );


        const history =
            rows
            .slice(1)
            .map(row => {

                const item = {};

                headers.forEach(
                    (header, index) => {

                        item[header] =
                            row[index] || "";

                    }
                );

                return item;

            })
            .filter(item =>
                item["Athlete"] ===
                athleteName
            )
            .reverse();


        if (
            history.length === 0
        ) {

            container.innerHTML =
                "<p>No rating history yet.</p>";

            return;

        }


        container.innerHTML =
            history.map(
                item => `

                    <div class="history-item">

                        <div class="history-category">

                            ${escapeHTML(
                                item["Category"]
                            )}

                        </div>

                        <div class="history-change">

                            ${escapeHTML(
                                item["Old Rating"]
                            )}

                            →

                            ${escapeHTML(
                                item["New Rating"]
                            )}

                        </div>

                        <div class="history-date">

                            ${escapeHTML(
                                item["Date"]
                            )}

                        </div>

                    </div>

                `
            ).join("");


    } catch (error) {

        container.innerHTML =
            "<p>Unable to load history.</p>";

    }

}


/* ============================================
   ERROR
============================================ */

function showError(
    message
) {

    document
        .getElementById("content")
        .innerHTML = `

            <div class="profile">

                <h2>
                    Something went wrong
                </h2>

                <p
                    style="
                        margin-top: 10px;
                        color: #687281;
                    "
                >
                    ${escapeHTML(
                        message
                    )}
                </p>

            </div>

        `;

}


/* ============================================
   EXPORT CSV
============================================ */

function exportCSV() {

    const rows = [];


    rows.push([

        "Athlete",

        "Username",

        ...categories,

        "Coach Notes",

        "Last Updated"

    ]);


    athletes.forEach(
        athlete => {

            rows.push([

                athlete["Athlete"] || "",

                athlete["Username"] || "",

                ...categories.map(
                    category =>
                        athlete[category] || ""
                ),

                athlete["Coach Notes"] || "",

                athlete["Last Updated"] || ""

            ]);

        }
    );


    const csv =
        rows
        .map(row =>

            row
            .map(value =>

                '"' +
                String(value)
                    .replaceAll(
                        '"',
                        '""'
                    ) +
                '"'

            )
            .join(",")

        )
        .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type: "text/csv"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "athlete-rag-data.csv";


    link.click();


    URL.revokeObjectURL(
        url
    );

}

document

    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );
