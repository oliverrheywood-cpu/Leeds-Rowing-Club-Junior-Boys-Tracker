<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Athlete RAG Dashboard</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f9;
        color: #17202a;
    }

    /* HEADER */

    header {
        background: linear-gradient(135deg, #0b2239, #174b70);
        color: white;
        padding: 30px 40px;
    }

    header h1 {
        font-size: 30px;
        margin-bottom: 6px;
    }

    header p {
        color: #d9e6f2;
        font-size: 15px;
    }

    /* MAIN */

    .container {
        max-width: 1450px;
        margin: auto;
        padding: 25px;
    }

    /* TOOLBAR */

    .toolbar {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    input,
    select,
    textarea,
    button {
        font-family: inherit;
    }

    #search {
        flex: 1;
        min-width: 250px;
        padding: 12px 15px;
        border: 1px solid #d9dee5;
        border-radius: 10px;
        background: white;
        font-size: 15px;
    }

    #filter {
        padding: 12px 15px;
        border: 1px solid #d9dee5;
        border-radius: 10px;
        background: white;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 12px 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .primary {
        background: #102a43;
        color: white;
    }

    .secondary {
        background: white;
        border: 1px solid #d9dee5;
        color: #17202a;
    }

    button:hover {
        opacity: 0.85;
    }

    /* DASHBOARD STATS */

    .summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 22px;
    }

    .stat {
        background: white;
        border: 1px solid #e1e5ea;
        border-radius: 15px;
        padding: 18px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }

    .stat-title {
        color: #6b7280;
        font-size: 13px;
    }

    .stat-number {
        font-size: 28px;
        font-weight: bold;
        margin-top: 5px;
    }

    /* FOLDER */

    .folder {
        background: white;
        border: 1px solid #e1e5ea;
        border-radius: 17px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        overflow: hidden;
    }

    .folder-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s ease;
    }

    .folder-header:hover {
        background: #f8fafc;
    }

    .folder-left {
        display: flex;
        align-items: center;
        gap: 13px;
    }

    .folder-icon {
        font-size: 27px;
    }

    .folder-name {
        font-size: 20px;
        font-weight: bold;
    }

    .folder-count {
        font-size: 13px;
        color: #8a94a3;
        margin-top: 3px;
    }

    .folder-arrow {
        font-size: 20px;
        color: #687281;
        transition: transform 0.2s ease;
    }

    .folder.open .folder-arrow {
        transform: rotate(180deg);
    }

    .folder-content {
        display: none;
        padding: 0 20px 20px 20px;
    }

    .folder.open .folder-content {
        display: block;
    }

    /* ATHLETE GRID */

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 18px;
    }

    /* ATHLETE CARD */

    .card {
        background: white;
        border: 1px solid #e1e5ea;
        border-radius: 17px;
        padding: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .card:hover {
        box-shadow: 0 7px 22px rgba(0,0,0,0.08);
    }

    .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
    }

    .athlete-name {
        font-size: 19px;
        font-weight: bold;
    }

    .athlete-subtitle {
        font-size: 12px;
        color: #8a94a3;
        margin-top: 4px;
    }

    .initial {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #e8eef4;
        color: #102a43;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }

    /* RAG */

    .rag-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .rag-box {
        border: 1px solid #e1e5ea;
        border-radius: 11px;
        padding: 10px;
        background: #fafafa;
    }

    .rag-box label {
        display: block;
        font-size: 12px;
        color: #687281;
        margin-bottom: 7px;
    }

    .rag-select {
        width: 100%;
        padding: 8px;
        border: 1px solid #d9dee5;
        border-radius: 8px;
        background: white;
    }

    /* RAG DOTS */

    .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
    }

    .green {
        background: #16a34a;
    }

    .amber {
        background: #f59e0b;
    }

    .red {
        background: #dc2626;
    }

    .grey {
        background: #9ca3af;
    }

    /* NOTES */

    .notes {
        width: 100%;
        min-height: 85px;
        margin-top: 13px;
        padding: 10px;
        border: 1px solid #d9dee5;
        border-radius: 10px;
        resize: vertical;
    }

    /* CARD FOOTER */

    .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
    }

    .saved {
        font-size: 11px;
        color: #8a94a3;
    }

    /* EMPTY SEARCH */

    .empty-message {
        padding: 30px;
        text-align: center;
        color: #8a94a3;
        background: white;
        border: 1px solid #e1e5ea;
        border-radius: 12px;
    }

    /* MOBILE */

    @media (max-width: 750px) {

        header {
            padding: 22px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            padding: 15px;
        }

        .summary {
            grid-template-columns: 1fr 1fr;
        }

        .rag-grid {
            grid-template-columns: 1fr;
        }

        .grid {
            grid-template-columns: 1fr;
        }

        .folder-content {
            padding: 0 12px 12px 12px;
        }
    }
</style>
</head>

<body>

<header>

    <h1>🏆 Athlete RAG Dashboard</h1>

    <p>
        Athlete performance tracking • Red / Amber / Green assessment
    </p>

</header>


<div class="container">

    <!-- TOOLBAR -->

    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search athletes..."
            oninput="renderAthletes()"
        >

        <select id="filter" onchange="renderAthletes()">

            <option value="all">
                All athletes
            </option>

            <option value="red">
                Any Red
            </option>

            <option value="amber">
                Any Amber
            </option>

            <option value="green">
                Any Green
            </option>

            <option value="unrated">
                Unrated
            </option>

        </select>

        <button
            class="secondary"
            onclick="resetAll()"
        >
            Reset All
        </button>

        <button
            class="primary"
            onclick="exportCSV()"
        >
            Export CSV
        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="stat">

            <div class="stat-title">
                Athletes
            </div>

            <div
                class="stat-number"
                id="athleteCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                🟢 Green Ratings
            </div>

            <div
                class="stat-number"
                id="greenCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                🟠 Amber Ratings
            </div>

            <div
                class="stat-number"
                id="amberCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                🔴 Red Ratings
            </div>

            <div
                class="stat-number"
                id="redCount"
            >
                0
            </div>

        </div>

    </div>


    <!-- BOYS FOLDER -->

    <div
        class="folder open"
        id="boysFolder"
    >

        <div
            class="folder-header"
            onclick="toggleBoysFolder()"
        >

            <div class="folder-left">

                <div class="folder-icon">
                    📁
                </div>

                <div>

                    <div class="folder-name">
                        Boys
                    </div>

                    <div class="folder-count">
                        25 athletes
                    </div>

                </div>

            </div>


            <div
                class="folder-arrow"
                id="folderArrow"
            >
                ▼
            </div>

        </div>


        <div
            class="folder-content"
            id="boysContent"
        >

            <div
                id="athleteGrid"
                class="grid"
            ></div>

        </div>

    </div>

</div>


<script>

/* ============================================
   ATHLETE LIST
============================================ */

const athletes = [

    "Alex Green",
    "Bailey Marshall",
    "Bertie Beanland",
    "Gabriel Maida",
    "Hector Jones",
    "Jack Bailey",
    "Jack East",
    "Jacob Hallman",
    "Jacob Smith",
    "Jamie Ford",
    "Joe Tennant",
    "Lucas Brook",
    "Matty Lincoln",
    "Max Welsh",
    "Neo Patel",
    "Sam Lucione",
    "Seth Jones",
    "Seth Langdon",
    "Zac Lodge",
    "Ben Whittaker",
    "Charlie Watts",
    "Edward Steele",
    "Fred Tattersall",
    "Matthew Kerry",
    "Ryan Atkins"

];


/* ============================================
   PERFORMANCE AREAS
============================================ */

const categories = [

    "Technical",
    "Fitness",
    "Coxing / Performance",
    "Attitude",
    "Communication",
    "Consistency"

];


/* ============================================
   STORAGE
============================================ */

const STORAGE_KEY = "athlete-rag-dashboard";

let data = loadData();


function loadData() {

    try {

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || {};

    } catch {

        return {};

    }

}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* ============================================
   GET ATHLETE
============================================ */

function getAthlete(name) {

    if (!data[name]) {

        data[name] = {

            ratings: {},

            notes: ""

        };

    }

    return data[name];

}


/* ============================================
   RAG COLOUR
============================================ */

function getColour(value) {

    if (value === "Green") {
        return "green";
    }

    if (value === "Amber") {
        return "amber";
    }

    if (value === "Red") {
        return "red";
    }

    return "grey";

}


/* ============================================
   ESCAPE HTML
============================================ */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================================
   RENDER ATHLETES
============================================ */

function renderAthletes() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const filter =
        document
        .getElementById("filter")
        .value;

    const grid =
        document.getElementById("athleteGrid");

    grid.innerHTML = "";


    let visibleAthletes = 0;


    athletes.forEach(name => {

        const athlete = getAthlete(name);

        const ratings =
            Object.values(
                athlete.ratings
            );


        /* SEARCH */

        if (
            !name
            .toLowerCase()
            .includes(search)
        ) {

            return;

        }


        /* FILTER */

        if (
            filter === "red" &&
            !ratings.includes("Red")
        ) {

            return;

        }


        if (
            filter === "amber" &&
            !ratings.includes("Amber")
        ) {

            return;

        }


        if (
            filter === "green" &&
            !ratings.includes("Green")
        ) {

            return;

        }


        if (
            filter === "unrated" &&
            ratings.length !== 0
        ) {

            return;

        }


        visibleAthletes++;


        /* INITIALS */

        const initials =
            name
            .split(" ")
            .map(word => word[0])
            .join("")
            .substring(0, 2)
            .toUpperCase();


        /* CARD */

        const card =
            document.createElement("div");

        card.className = "card";


        /* RAG BOXES */

        let ragHTML = "";


        categories.forEach(category => {

            const current =
                athlete.ratings[category] || "";


            ragHTML += `

                <div class="rag-box">

                    <label>

                        <span
                            class="dot ${getColour(current)}"
                        ></span>

                        ${escapeHTML(category)}

                    </label>


                    <select
                        class="rag-select"
                        onchange="
                            setRating(
                                '${escapeJS(name)}',
                                '${escapeJS(category)}',
                                this.value
                            )
                        "
                    >

                        <option value="">
                            Not rated
                        </option>

                        <option
                            value="Green"
                            ${current === "Green" ? "selected" : ""}
                        >
                            🟢 Green
                        </option>

                        <option
                            value="Amber"
                            ${current === "Amber" ? "selected" : ""}
                        >
                            🟠 Amber
                        </option>

                        <option
                            value="Red"
                            ${current === "Red" ? "selected" : ""}
                        >
                            🔴 Red
                        </option>

                    </select>

                </div>

            `;

        });


        card.innerHTML = `

            <div class="card-top">

                <div>

                    <div class="athlete-name">

                        ${escapeHTML(name)}

                    </div>

                    <div class="athlete-subtitle">

                        Athlete profile

                    </div>

                </div>


                <div class="initial">

                    ${initials}

                </div>

            </div>


            <div class="rag-grid">

                ${ragHTML}

            </div>


            <textarea
                class="notes"
                placeholder="Add notes about this athlete..."
                oninput="
                    setNotes(
                        '${escapeJS(name)}',
                        this.value
                    )
                "
            >${escapeHTML(athlete.notes)}</textarea>


            <div class="card-footer">

                <span class="saved">

                    ✓ Automatically saved

                </span>


                <button
                    class="secondary"
                    onclick="
                        clearAthlete(
                            '${escapeJS(name)}'
                        )
                    "
                >

                    Clear

                </button>

            </div>

        `;


        grid.appendChild(card);

    });


    if (visibleAthletes === 0) {

        grid.innerHTML = `

            <div class="empty-message">

                No athletes match your search or filter.

            </div>

        `;

    }


    updateStats();

}


/* ============================================
   TOGGLE BOYS FOLDER
============================================ */

function toggleBoysFolder() {

    const folder =
        document.getElementById("boysFolder");

    folder.classList.toggle("open");

}


/* ============================================
   ESCAPE JAVASCRIPT
============================================ */

function escapeJS(text) {

    return text
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");

}


/* ============================================
   SET RATING
============================================ */

function setRating(
    name,
    category,
    value
) {

    const athlete =
        getAthlete(name);


    if (value === "") {

        delete athlete.ratings[category];

    } else {

        athlete.ratings[category] = value;

    }


    saveData();

    renderAthletes();

}


/* ============================================
   SET NOTES
============================================ */

function setNotes(
    name,
    value
) {

    const athlete =
        getAthlete(name);

    athlete.notes = value;

    saveData();

}


/* ============================================
   CLEAR ONE ATHLETE
============================================ */

function clearAthlete(name) {

    const confirmClear =
        confirm(
            "Clear all ratings and notes for " +
            name +
            "?"
        );


    if (!confirmClear) {
        return;
    }


    delete data[name];

    saveData();

    renderAthletes();

}


/* ============================================
   RESET EVERYTHING
============================================ */

function resetAll() {

    const confirmReset =
        confirm(
            "Are you sure you want to clear EVERY athlete?"
        );


    if (!confirmReset) {
        return;
    }


    data = {};

    saveData();

    renderAthletes();

}


/* ============================================
   STATISTICS
============================================ */

function updateStats() {

    let green = 0;
    let amber = 0;
    let red = 0;


    athletes.forEach(name => {

        const athlete =
            getAthlete(name);


        Object.values(
            athlete.ratings
        ).forEach(value => {

            if (value === "Green") {
                green++;
            }

            if (value === "Amber") {
                amber++;
            }

            if (value === "Red") {
                red++;
            }

        });

    });


    document
        .getElementById("athleteCount")
        .textContent = athletes.length;


    document
        .getElementById("greenCount")
        .textContent = green;


    document
        .getElementById("amberCount")
        .textContent = amber;


    document
        .getElementById("redCount")
        .textContent = red;

}


/* ============================================
   EXPORT CSV
============================================ */

function exportCSV() {

    const rows = [];


    /* HEADER */

    rows.push([

        "Folder",

        "Athlete",

        ...categories,

        "Notes"

    ]);


    /* DATA */

    athletes.forEach(name => {

        const athlete =
            getAthlete(name);


        rows.push([

            "Boys",

            name,

            ...categories.map(
                category =>
                    athlete.ratings[category] || ""
            ),

            athlete.notes || ""

        ]);

    });


    /* CSV */

    const csv = rows
        .map(row =>

            row
            .map(value =>

                '"' +
                String(value)
                .replaceAll('"', '""') +
                '"'

            )
            .join(",")

        )
        .join("\n");


    /* DOWNLOAD */

    const blob =
        new Blob(
            [csv],
            {
                type: "text/csv"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "athlete-rag-data.csv";


    link.click();


    URL.revokeObjectURL(url);

}


/* ============================================
   START WEBSITE
============================================ */

renderAthletes();

</script>

</body>
</html>
